# Gradle runs on Android Studio's bundled JetBrains Runtime through JAVA_HOME (AGENTS.md,
# Android JDK). This project sets no daemon JVM criteria and no org.gradle.java.home; where a
# user-level ~/.gradle/gradle.properties sets org.gradle.java.home to another JDK, pass
# -Dorg.gradle.java.home="$JAVA_HOME" on the command line, which takes precedence.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
